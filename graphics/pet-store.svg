<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-label="The pet store before and after. Before: the browser client calls one pet store server, which reads and writes the database. After, serverless: the client authenticates with a third-party authentication service (1), reads the product database directly (2), and holds more of the application logic (3). Search (4) and purchase (5) run as separate functions behind an API gateway; the search function reads the product database and the purchase function writes a purchase database.">
<title>A pet store, before and after going serverless</title>
<style>
text { font-family: "Helvetica Neue", Arial, sans-serif; fill: #222; font-size: 18px; text-anchor: middle; }
.label { font-size: 16px; font-weight: bold; letter-spacing: 1px; fill: #555; }
.badge { font-size: 16px; font-weight: bold; fill: #fff; }
.note { font-size: 15px; fill: #555; font-style: italic; }
</style>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a90d9"/></marker></defs>
<rect width="1000" height="760" fill="#fff"/>
<text x="30" y="34" class="label" style="text-anchor: start">BEFORE: TRADITIONAL</text>
<ellipse cx="180" cy="110" rx="100" ry="50" fill="#d6ecf7" stroke="#777" stroke-width="1.5"/><text x="180" y="105">Client</text><text x="180" y="127">(browser)</text>
<path d="M282,110 L412,110" fill="none" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#h)"/>
<rect x="415.0" y="72.0" width="170" height="76" rx="6" fill="#dff0d8" stroke="#777" stroke-width="1.5"/><text x="500" y="105">Pet Store</text><text x="500" y="127">Server</text>
<path d="M587,110 L717,110" fill="none" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#h)"/>
<path d="M725.0,62.0 L725.0,148.0 A85.0,12 0 0 0 895.0,148.0 L895.0,62.0" fill="#fbe3cf" stroke="#777" stroke-width="1.5"/><ellipse cx="810" cy="62.0" rx="85.0" ry="12" fill="#fbe3cf" stroke="#777" stroke-width="1.5"/><text x="810" y="119">Database</text>
<line x1="20" y1="200" x2="980" y2="200" stroke="#ccc" stroke-width="1.5" stroke-dasharray="6 6"/>
<text x="30" y="240" class="label" style="text-anchor: start">AFTER: SERVERLESS</text>
<g transform="translate(0,200)">
<ellipse cx="140" cy="290" rx="105" ry="55" fill="#d6ecf7" stroke="#777" stroke-width="1.5"/><text x="140" y="285">Client</text><text x="140" y="307">(browser)</text>
<rect x="345.0" y="48.0" width="250" height="64" rx="32" fill="#fff6c2" stroke="#777" stroke-width="1.5"/><text x="470" y="75">Authentication Service</text><text x="470" y="97">(BaaS)</text>
<rect x="385.0" y="262.0" width="170" height="56" rx="6" fill="#ececec" stroke="#777" stroke-width="1.5"/><text x="470" y="296">API Gateway</text>
<rect x="650.0" y="160.0" width="190" height="60" rx="18" fill="#dff0d8" stroke="#777" stroke-width="1.5"/><text x="745" y="185">Purchase</text><text x="745" y="207">Function</text>
<rect x="650.0" y="360.0" width="190" height="60" rx="18" fill="#dff0d8" stroke="#777" stroke-width="1.5"/><text x="745" y="385">Search</text><text x="745" y="407">Function</text>
<path d="M860.0,258.0 L860.0,342.0 A65.0,12 0 0 0 990.0,342.0 L990.0,258.0" fill="#fbe3cf" stroke="#777" stroke-width="1.5"/><ellipse cx="925" cy="258.0" rx="65.0" ry="12" fill="#fbe3cf" stroke="#777" stroke-width="1.5"/><text x="925" y="303">Purchase</text><text x="925" y="325">Database</text>
<path d="M375.0,428.0 L375.0,512.0 A95.0,12 0 0 0 565.0,512.0 L565.0,428.0" fill="#fbe3cf" stroke="#777" stroke-width="1.5"/><ellipse cx="470" cy="428.0" rx="95.0" ry="12" fill="#fbe3cf" stroke="#777" stroke-width="1.5"/><text x="470" y="473">Product</text><text x="470" y="495">Database</text>
<path d="M175,238 C210,120 260,82 342,80" fill="none" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#h)"/>
<path d="M247,290 L381,290" fill="none" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#h)"/>
<path d="M557,280 C610,250 610,195 648,192" fill="none" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#h)"/>
<path d="M557,300 C610,330 610,385 648,388" fill="none" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#h)"/>
<path d="M842,205 C880,215 920,235 924,254" fill="none" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#h)"/>
<path d="M745,422 C745,470 640,478 568,475" fill="none" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#h)"/>
<path d="M180,342 C230,450 300,472 372,472" fill="none" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#h)"/>
<circle cx="330" cy="52" r="15" fill="#c0398a"/><text x="330" y="58" class="badge">1</text>
<circle cx="352" cy="505" r="15" fill="#c0398a"/><text x="352" y="511" class="badge">2</text>
<circle cx="60" cy="230" r="15" fill="#c0398a"/><text x="60" y="236" class="badge">3</text>
<circle cx="860" cy="415" r="15" fill="#c0398a"/><text x="860" y="421" class="badge">4</text>
<circle cx="860" cy="160" r="15" fill="#c0398a"/><text x="860" y="166" class="badge">5</text>
</g>
</svg>
