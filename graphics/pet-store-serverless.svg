<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="The serverless pet store. The client authenticates with a third-party authentication service (1), reads the product database directly (2), and holds more of the application logic (3). Search (4) and purchase (5) run as separate functions behind an API gateway; the search function reads the product database and the purchase function writes a purchase database.">
<title>A serverless pet store</title>
<style>
text { font-family: "Helvetica Neue", Arial, sans-serif; fill: #222; font-size: 18px; text-anchor: middle; }
.label { font-size: 16px; font-weight: bold; letter-spacing: 1px; fill: #555; }
.badge { font-size: 16px; font-weight: bold; fill: #fff; }
.note { font-size: 15px; fill: #555; font-style: italic; }
</style>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a90d9"/></marker></defs>
<rect width="1000" height="560" fill="#fff"/>
