<rect x="600.0" y="65.0" width="160" height="70" rx="6" fill="#dff0d8" stroke="#777" stroke-width="1.5"/><text x="680" y="95">Click</text><text x="680" y="117">Processor</text>
<path d="M762,100 L842,100" fill="none" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#h)"/>
