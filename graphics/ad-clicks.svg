<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 645" width="1000" height="645" role="img" aria-label="Ad click processing three ways. Traditional: the ad server sends click messages through a message channel to one long-running click processor, which writes to the database. Serverless: the channel triggers click-processor functions, and the platform runs as many instances as the load needs. Containers: an autoscaler watches the channel's queue length and adds or removes click-processor container replicas, down to zero.">
<title>Ad click processing: traditional, serverless, and containers</title>
