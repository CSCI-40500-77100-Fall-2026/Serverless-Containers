<path d="M780,545 L842,545" fill="none" stroke="#4a90d9" stroke-width="2.5" marker-end="url(#h)"/>
<rect x="580.0" y="433.0" width="200" height="40" rx="6" fill="#ececec" stroke="#777" stroke-width="1.5"/><text x="680" y="459">Autoscaler (e.g., KEDA)</text>
